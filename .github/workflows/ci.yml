name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build and test
        run: ./mvnw test

      - name: Package jar for Docker
        run: ./mvnw -DskipTests package

      - name: Start app with Docker Compose
        run: docker compose up -d --build app

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://app:8080/actuator/health > /dev/null; then
              echo "Health check OK"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "Health check failed"
          exit 1

      - name: Shutdown docker compose
        if: always()
        run: docker compose down
