name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build and test
        run: ./mvnw test

      - name: Package jar for Docker
        run: ./mvnw -DskipTests package

      - name: Start app with Docker Compose
        run: docker compose up -d --build app

      - name: Shutdown docker compose
        if: always()
        run: docker compose down
