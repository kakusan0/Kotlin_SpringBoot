spring:
  cloud:
    vault:
      enabled: true
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    hikari:
      maximum-pool-size: 20
  flyway:
    clean-disabled: true
  thymeleaf:
    cache: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 31536000
          cache-public: true
  data:
    redis:
      host: ${redis.host:redis-host}
      password: ${redis.password:}
      jedis:
        pool:
          max-active: 20
  session:
    store-type: redis
    redis:
      namespace: app:sessions
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        same-site: strict

logging:
  level:
    root: WARN
    com.example.demo: INFO

geoip:
  mmdb-path: /opt/geoip/GeoLite2-Country.mmdb
  allowed-country-codes: JP

app:
  trust-proxy: true
  login:
    rate-limit:
      capacity: 5
      refill-minutes: 5

webauthn:
  rp:
    id: ${WEBAUTHN_RP_ID:infoapp.org}
    name: ${WEBAUTHN_RP_NAME:Production RP}
    origin: ${WEBAUTHN_RP_ORIGIN:https://infoapp.org}
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:https://infoapp.org}