spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:vault://
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:true}
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:root-token}
      # 認証方式やパスが環境変数で指定される場合のみ保持
      kubernetes:
        role: ${VAULT_K8S_ROLE:}
      app-role:
        role-id: ${VAULT_APPROLE_ROLE_ID:}
        secret-id: ${VAULT_APPROLE_SECRET_ID:}
  session:
    store-type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:}
      jedis:
        pool:
          max-active: 20
  servlet:
    session:
      timeout: 30m
  flyway:
    baseline-on-migrate: true
    baseline-version: "0"
  cache:
    cache-names:
      - menuById
      - pathById
  jackson:
    time-zone: Asia/Tokyo
    default-property-inclusion: non_null
  devtools:
    restart:
      additional-exclude: mapper/**,db/migration/**

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  # configuration は MyBatisConfig.java で一元管理

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  login:
    rate-limit:
      capacity: 5
      refill-minutes: 5
  trust-proxy: true

server:
  forward-headers-strategy: framework

webauthn:
  rp:
    id: ${WEBAUTHN_RP_ID:infoapp.org}
    name: ${WEBAUTHN_RP_NAME:Dev RP}
    origin: ${WEBAUTHN_RP_ORIGIN:https://infoapp.org}
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:https://infoapp.org}

report:
  holidayPosition: START