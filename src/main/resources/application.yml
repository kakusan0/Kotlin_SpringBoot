spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:vault://
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:true}
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:root-token}
      # 認証方式やパスが環境変数で指定される場合のみ保持
      kubernetes:
        role: ${VAULT_K8S_ROLE:}
      app-role:
        role-id: ${VAULT_APPROLE_ROLE_ID:}
        secret-id: ${VAULT_APPROLE_SECRET_ID:}
  session:
    store-type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:}
      jedis:
        pool:
          max-active: 20
  servlet:
    session:
      timeout: 30m
  flyway:
    baseline-on-migrate: true
    baseline-version: "0"
  cache:
    cache-names:
      - menuById
      - pathById
  jackson:
    time-zone: Asia/Tokyo
    default-property-inclusion: non_null
  devtools:
    restart:
      additional-exclude: mapper/**,db/migration/**

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  # configuration は MyBatisConfig.java で一元管理

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  login:
    rate-limit:
      capacity: 5
      refill-minutes: 5
  trust-proxy: true
  # ---- LDAP認証設定 ----
  # 本番環境でLDAP認証を有効にする場合は true にし、
  # spring.ldap.* に実LDAPサーバーの接続情報を設定すること
  ldap:
    enabled: ${LDAP_ENABLED:false}
    user-search-base: ${LDAP_USER_SEARCH_BASE:ou=users}
    user-search-filter: ${LDAP_USER_SEARCH_FILTER:(uid={0})}
    group-search-base: ${LDAP_GROUP_SEARCH_BASE:ou=groups}
    group-search-filter: ${LDAP_GROUP_SEARCH_FILTER:(member={0})}

  # ---- LDAPサーバー接続設定 ----
  # 本番環境では環境変数または Vault から注入すること
  ldap:
    urls: ${LDAP_URLS:ldap://localhost:389}
    base: ${LDAP_BASE:dc=example,dc=com}
    username: ${LDAP_MANAGER_DN:}
    password: ${LDAP_MANAGER_PASSWORD:}

server:
  forward-headers-strategy: framework

webauthn:
  rp:
    id: ${WEBAUTHN_RP_ID:infoapp.org}
    name: ${WEBAUTHN_RP_NAME:Dev RP}
    origin: ${WEBAUTHN_RP_ORIGIN:https://infoapp.org}
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:https://infoapp.org}

report:
  holidayPosition: START