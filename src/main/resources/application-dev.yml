spring:
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    hikari:
      maximum-pool-size: 20
  flyway:
    clean-disabled: true
  thymeleaf:
    cache: false
  devtools:
    restart:
      additional-paths: src/main/resources/templates,src/main/resources/static
      exclude: logs/**,tmp/**,**/*Test.class,**/*.log
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 0
  data:
    redis:
      host: localhost
  # ---- 組み込みLDAP (UnboundID) 設定 ----
  # app.ldap.enabled=true のときのみ参照される
  # 組み込みLDAPサーバーは常に起動するが、認証への利用はフラグで制御する
  ldap:
    embedded:
      base-dn: dc=example,dc=com
      ldif: classpath:ldap/test-users.ldif
      port: 8389
      validation:
        enabled: false
    urls: ldap://localhost:8389
    base: dc=example,dc=com

geoip:
  mmdb-path: ${location.path:/opt/geoip/GeoLite2-Country.mmdb}
  allowed-country-codes: JP

app:
  encryption:
    key: "CHANGE_ME_LOCAL_ONLY"
  login:
    rate-limit:
      capacity: 10
      refill-minutes: 1
  csp:
    connect-src: "'self' http://localhost:35729 ws://localhost:35729"
  # ---- LDAP認証設定 ----
  # true にすると組み込みLDAPによる認証が有効になる (ローカル開発用)
  # デフォルトは false: InMemory認証 (SecurityConfig の userDetailsService) が使われる
  # LDAPサンプルを試す場合は true に変更すること
  # 本番では spring.ldap.urls 等を実際のLDAPサーバーに向けること
  ldap:
    enabled: false
    user-search-base: ou=users
    user-search-filter: "(uid={0})"
    group-search-base: ou=groups
    group-search-filter: "(member={0})"

server:
  port: 8080
  compression:
    enabled: true

logging:
  level:
    com.example.demo: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.mybatis: DEBUG