spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  flyway:
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  thymeleaf:
    cache: false
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources/templates,src/main/resources/static,src/main/kotlin
      exclude: logs/**,tmp/**,**/*Test.class,**/*.log
    livereload:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 0
          cache-public: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      jedis:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: -1ms
  session:
    store-type: redis
    redis:
      namespace: spring:session
      flush-mode: on_save
      save-mode: on_set_attribute
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 30m
    redis:
      namespace: app:sessions

geoip:
  mmdb-path: C:/Users/gmaki/GeoLite2-Country.mmdb
  allowed-country-codes: JP

app:
  encryption:
    key: "CHANGE_ME_LOCAL_ONLY"
  login:
    rate-limit:
      capacity: 10
      refill-minutes: 1
  trust-proxy: false
  csp:
    connect-src: "'self' http://localhost:35729 ws://localhost:35729"

server:
  port: 8080
  ssl:
    enabled: false
  servlet:
    session:
      cookie:
        secure: false
      timeout: 5m
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024
  http2:
    enabled: true
  # ========== 開発環境用 Undertow 最適化設定 ==========
  # spring-boot:run で使用するため、リソース節約と高速起動を優先
  undertow:
    # スレッド設定: 開発環境は少なめで OK
    threads:
      io: 2              # I/O スレッド数（デフォルト: CPU コア数）
      worker: 10         # ワーカースレッド数（デフォルト: I/O * 8）
    # バッファ設定
    buffer-size: 1024    # バッファサイズ（バイト）
    direct-buffers: true # ダイレクトバッファ使用（パフォーマンス向上）
    # アクセスログ（開発時は無効でパフォーマンス向上）
    accesslog:
      enabled: false
      dir: logs
      prefix: access_log
      suffix: .log
    # その他の設定
    eager-filter-init: true          # フィルタの即時初期化
    max-http-post-size: 10485760     # POST データ最大サイズ（10MB）
    no-request-timeout: 60000        # リクエストタイムアウト（ms）

logging:
  level:
    root: INFO
    com.example.demo: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.mybatis: DEBUG
