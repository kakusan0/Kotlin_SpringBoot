<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>ログイン</title>
    <link href="/favicon.ico" rel="icon" th:href="@{/favicon.ico}"/>
    <link href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <link href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"
          th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}"/>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header">ログイン</div>
                <div class="card-body">
                    <div class="alert alert-info" th:if="${message}" th:text="${message}"></div>
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                    <form action="/login" id="loginForm" method="post" th:action="@{/login}">
                        <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">
                        <div class="form-floating mb-3">
                            <input autofocus class="form-control" id="username" name="username"
                                   placeholder="ユーザー名" required th:value="${username}">
                            <label for="username">ユーザー名</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input class="form-control" id="password" name="password" placeholder="パスワード" required
                                   type="password">
                            <label for="password">パスワード</label>
                            <button class="btn btn-outline-secondary position-absolute end-0 top-50 translate-middle-y"
                                    id="togglePassword" type="button">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">ログイン</button>
                    </form>
                    <!-- パスキーでログイン -->
                    <div class="text-center mt-3">
                        <hr class="my-3">
                        <small class="text-muted">または</small>
                    </div>
                    <button class="btn btn-outline-success w-100 mt-2" id="btnPasskeyLogin" type="button">
                        <i class="bi bi-fingerprint me-1"></i>パスキーでログイン
                    </button>
                    <div class="mt-2 small text-muted text-center" id="loginPasskeyStatus"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"
        th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
<script defer th:src="@{/js/login.js}"></script>
<script>
    // パスキーログイン処理
    document.addEventListener('DOMContentLoaded', () => {
        const usernameInput = document.getElementById('username');
        const passkeyLoginBtn = document.getElementById('btnPasskeyLogin');
        const passkeyStatus = document.getElementById('loginPasskeyStatus');

        const b64uToArray = (b64) => Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
        const arrayToB64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");

        if (passkeyLoginBtn && usernameInput) {
            passkeyLoginBtn.addEventListener('click', async () => {
                const username = usernameInput.value.trim();
                if (!username) {
                    if (passkeyStatus) {
                        passkeyStatus.textContent = 'ユーザー名を入力してください';
                        passkeyStatus.classList.add('text-danger');
                    }
                    return;
                }
                try {
                    passkeyLoginBtn.disabled = true;
                    if (passkeyStatus) {
                        passkeyStatus.textContent = 'チャレンジ取得中...';
                        passkeyStatus.classList.remove('text-danger');
                    }

                    const res = await fetch(`/api/webauthn/authentication/options?username=${encodeURIComponent(username)}`);
                    if (!res.ok) {
                        const msg = (await res.json().catch(() => ({}))).message || 'パスキーが登録されていません';
                        throw new Error(msg);
                    }
                    const options = await res.json();

                    options.challenge = b64uToArray(options.challenge).buffer;
                    options.allowCredentials = options.allowCredentials.map(ac => ({
                        ...ac,
                        id: b64uToArray(ac.id).buffer
                    }));

                    if (passkeyStatus) passkeyStatus.textContent = '認証中...';

                    const assertion = await navigator.credentials.get({publicKey: options});
                    if (!assertion) throw new Error('認証がキャンセルされました');

                    const finishRes = await fetch(`/api/webauthn/authentication/finish?username=${encodeURIComponent(username)}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            id: assertion.id,
                            rawId: arrayToB64u(assertion.rawId),
                            type: assertion.type,
                            response: {
                                authenticatorData: arrayToB64u(assertion.response.authenticatorData),
                                clientDataJSON: arrayToB64u(assertion.response.clientDataJSON),
                                signature: arrayToB64u(assertion.response.signature),
                                userHandle: assertion.response.userHandle ? arrayToB64u(assertion.response.userHandle) : null
                            }
                        })
                    });

                    if (!finishRes.ok) {
                        const msg = (await finishRes.json().catch(() => ({}))).message || '認証に失敗しました';
                        throw new Error(msg);
                    }
                    if (passkeyStatus) passkeyStatus.textContent = 'ログイン成功！リダイレクト中...';
                    setTimeout(() => window.location.href = '/tools', 300);
                } catch (e) {
                    console.error(e);
                    if (passkeyStatus) {
                        passkeyStatus.textContent = `エラー: ${e.message}`;
                        passkeyStatus.classList.add('text-danger');
                    }
                } finally {
                    passkeyLoginBtn.disabled = false;
                }
            });
        }
    });
</script>
</body>
</html>
